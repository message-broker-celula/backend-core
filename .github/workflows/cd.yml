name: Backend CD

# Solo se dispara automaticamente cuando el CI ("Backend CI") termino en
# exito sobre la rama main. Nunca se ejecuta sobre Pull Requests ni ramas
# externas, así un PR malicioso jamas puede alcanzar los secrets de deploy.
on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - main

# Permisos minimos posibles (principio de menor privilegio).
permissions:
  contents: read
  packages: write

# Evita despliegues solapados: si llegan varios triggers seguidos
# (ej. varios pushes rapidos a main), solo corre uno a la vez y no se
# cancela un deploy en curso a mitad de camino.
concurrency:
  group: backend-core-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    # Requiere aprobacion manual en Settings -> Environments -> production
    # (recomendado) para que un secret comprometido en Actions no pueda
    # desplegar sin que un humano lo apruebe.
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af

      - name: Verify deployment (a traves de Nginx, no del puerto interno)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            sleep 5
            curl -f http://localhost/health || (echo "Health check fallo" && exit 1)
            echo "Backend desplegado y respondiendo detras de Nginx"
