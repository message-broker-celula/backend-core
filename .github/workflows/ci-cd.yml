name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build -f Dockerfile -t ${{ steps.meta.outputs.image }}:latest .
          docker push ${{ steps.meta.outputs.image }}:latest

  deploy:
    name: Desplegar en el VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectarse por SSH y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_VPS }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PEDRITO }}
          port: 22
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export BACKEND_IMAGE="ghcr.io/message-broker-celula/backend-core:latest"

            docker pull $BACKEND_IMAGE
            cd /home/Back/backend-core
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend
            docker image prune -f
            echo "Despliegue completado con éxito: $(date)"