name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        run: uv sync --all-groups

      - name: Run backend test suite
        run: uv run python -m pytest -q

      # provisioner/ is a separate deployable project (own pyproject.toml,
      # own venv) -- see the testpaths comment in the root pyproject.toml
      # for why its tests can't just be picked up by the step above.
      - name: Install provisioner dependencies
        working-directory: provisioner
        run: uv sync --all-groups

      - name: Run provisioner test suite
        working-directory: provisioner
        run: uv run python -m pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image names
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "provisioner_image=${IMAGE,,}-provisioner" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          docker build -t ${{ steps.meta.outputs.image }}:latest .
          docker push ${{ steps.meta.outputs.image }}:latest

      - name: Build and push provisioner image
        run: |
          docker build -t ${{ steps.meta.outputs.provisioner_image }}:latest ./provisioner
          docker push ${{ steps.meta.outputs.provisioner_image }}:latest

  deploy:
    name: Deploy VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_VPS }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PEDRITO }}
          port: 22
          script: |
            set -e

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /srv/projects/backend-core

            # Pulls both backend-core and backend-core-provisioner (image:
            # references in docker-compose.prod.yml), not just the backend.
            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml down

            docker compose -f docker-compose.prod.yml up -d

            docker image prune -af

            echo "Deployment completed successfully: $(date)"
