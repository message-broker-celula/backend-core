version: 2
updates:
  # Mantiene las GitHub Actions de terceros (docker/*, appleboy/*, etc.)
  # actualizadas automáticamente ante vulnerabilidades conocidas.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Mantiene fastapi, uvicorn, slowapi, etc. al dia con parches de seguridad.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
