# ============================================================================
# Reverse proxy para api.<celula>.andrescortes.dev -> backend-core (FastAPI)
# Mitigacion de DoS: limit_req, limit_conn, timeouts anti-Slowloris.
# Colocar en /etc/nginx/conf.d/backend.conf o /etc/nginx/sites-available/
# ============================================================================

# --- Zonas de limitacion (van en http{} -> nginx.conf principal, ver mas abajo) ---
# Se referencian aqui con limit_req_zone/limit_conn_zone definidas globalmente.

# Formato de log que fail2ban va a parsear para banear IPs abusivas
log_format ratelimit '$remote_addr - $status "$request" rt=$request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.CELULA.andrescortes.dev;

    # --- Mitigacion Slowloris: cerrar conexiones lentas rapido ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;

    # --- Limite de tamano de payload (defensa en profundidad, ver app/main.py) ---
    client_max_body_size 1m;
    large_client_header_buffers 4 8k;

    # --- Limites de conexiones y peticiones por IP ---
    limit_conn conn_per_ip 10;          # max 10 conexiones simultaneas por IP
    limit_req zone=req_per_ip burst=20 nodelay;  # ~10 req/s sostenidas, ráfagas de 20
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/backend-access.log ratelimit;
    error_log  /var/log/nginx/backend-error.log warn;

    # Ocultar version de Nginx en headers/errores
    server_tokens off;

    location / {
        proxy_pass http://backend_core_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts hacia el upstream (evita que un backend colgado agote workers)
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # /health sin limite estricto para que el healthcheck del compose no falle falsamente
    location /health {
        limit_req zone=req_per_ip burst=40 nodelay;
        proxy_pass http://backend_core_upstream/health;
        access_log off;
    }
}

upstream backend_core_upstream {
    # Nombre del servicio en docker-compose.prod.yml (red interna, sin exponer puerto al host)
    server backend:8000;
    keepalive 16;
}
