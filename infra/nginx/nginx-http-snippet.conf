# ============================================================================
# Este archivo se monta automaticamente como /etc/nginx/conf.d/00-limits.conf
# via docker-compose.prod.yml (el nombre "00-" asegura que Nginx lo cargue
# antes que 10-backend.conf, aunque el orden no es estrictamente necesario:
# nginx resuelve las zonas independientemente del orden fisico de archivos
# dentro del mismo bloque http).
# ============================================================================

# 10 req/s de tasa sostenida por IP, memoria compartida de 10MB (~160k IPs)
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;

# Maximo de conexiones concurrentes por IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# No revelar version de Nginx
server_tokens off;

# Buffers pequenos por defecto -> mitiga floods de headers gigantes
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
