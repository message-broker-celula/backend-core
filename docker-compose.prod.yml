services:
  backend:
    container_name: backend-core-backend
    image: ghcr.io/message-broker-celula/backend-core:latest

    # NO se publica el puerto al host: solo es alcanzable desde
    # la red interna "internal_net", via Nginx. Ataques directos
    # al puerto 8000 desde Internet ya no son posibles.
    expose:
      - "8000"

    restart: unless-stopped

    env_file:
      - .env

    networks:
      - internal_net

    depends_on:
      provisioner:
        condition: service_healthy

    # Limites de recursos reales para 'docker compose up' (fuera de Swarm,
    # el bloque deploy.resources.limits se IGNORA silenciosamente; estas
    # claves top-level si se aplican). Evita que un flood agote CPU/RAM
    # del host y tumbe tambien otros servicios de la VPS.
    cpus: "1.0"
    mem_limit: 512m

    healthcheck:
      # curl NO viene instalado en python:3.12-slim (imagen base del
      # Dockerfile). Se usa el modulo urllib de la stdlib para no tener
      # que agregar paquetes extra a la imagen.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # periodo de gracia: fallos aqui no cuentan mientras arranca

    logging:
      driver: json-file
      options:
        max-size: "10m"   # evita que logs de un ataque llenen el disco
        max-file: "3"

  # Sidecar con el UNICO acceso al socket de Docker en todo el despliegue.
  # backend-core-backend nunca toca Docker directo -- le pide crear/parar/
  # arrancar/eliminar contenedores de motores de BD (MySQL, etc.) a este
  # servicio via internal_net. Aisla ese acceso (equivalente a root sobre el
  # host) del proceso que maneja login OAuth/input de usuarios externos.
  # Los contenedores de motores que este servicio crea NO son miembros de
  # internal_net -- viven en "provisioned_net", separados de backend/nginx.
  provisioner:
    container_name: backend-core-provisioner
    image: ghcr.io/message-broker-celula/backend-core-provisioner:latest

    expose:
      - "9000"

    restart: unless-stopped

    env_file:
      - .env.provisioner

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - internal_net

    cpus: "0.5"
    mem_limit: 256m

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    container_name: backend-core-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # 00- se carga primero (alfabetico) -> zonas limit_req/limit_conn
      # quedan definidas antes de que backend.conf las use.
      - ./infra/nginx/nginx-http-snippet.conf:/etc/nginx/conf.d/00-limits.conf:ro
      # Se monta como "default.conf" para REEMPLAZAR por completo el
      # server block de bienvenida que trae la imagen base de Nginx
      # (evita cualquier ambiguedad de cual server{} responde en el puerto 80).
      - ./infra/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx

    networks:
      - internal_net

    depends_on:
      backend:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal_net:
    driver: bridge
  # Red donde el provisioner conecta los contenedores de motores de BD que
  # crea dinamicamente (no son servicios estaticos de este compose). Nombre
  # explicito porque provisioner/app/docker_client.py la referencia literal.
  # Aislada de internal_net: un contenedor de motor provisionado nunca puede
  # alcanzar backend/nginx/provisioner.
  provisioned_net:
    name: provisioned_net
    driver: bridge

volumes:
  nginx_logs:
